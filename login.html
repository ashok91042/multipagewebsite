<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Northstar Studio</title>
  <meta name="description" content="Log in to Northstar Studio using your session-based account.">
  <meta property="og:title" content="Login | Northstar Studio">
  <meta property="og:description" content="Northstar Studio secured session sign-in.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/login.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html" aria-label="Northstar Studio home"><span class="logo-mark" aria-hidden="true">N</span> Northstar</a>
      <button class="menu-button" type="button" data-menu-button aria-expanded="false" aria-controls="primary-navigation">Menu</button>
      <nav id="primary-navigation" data-primary-navigation aria-label="Primary navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <div class="auth-links" data-auth-area>
          <a class="auth-link" data-login-link href="login.html">Log in</a>
          <div class="user-badge" data-user-block hidden>
            <span>Hi,</span>
            <strong data-auth-name>Guest</strong>
            <button class="button auth-button" type="button" data-logout-button>Log out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="auth-page">
    <section class="auth-shell">
      <div class="container">
        <div class="auth-card">
          <p class="eyebrow">Secure access</p>
          <h1>Welcome back.</h1>
          <p class="lede">Use your Northstar Studio account to start a session.</p>

          <form class="auth-form" data-login-form novalidate>
            <div class="auth-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="team@northstar.studio" required>
            </div>

            <div class="auth-field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>

            <button class="button" type="submit">Log in</button>
            <p class="auth-status" data-login-message aria-live="polite">Use team@northstar.studio / northstar123</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>&copy; <span data-current-year>2026</span> Northstar Studio. Based in the real world.</p>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
